name: lint

on:
  pull_request:

permissions:
  contents: read

env:
  # Pinned tool versions, kept up to date by Renovate (see renovate.json).
  # renovate: datasource=github-releases depName=koalaman/shellcheck
  SHELLCHECK_VERSION: v0.11.0
  # renovate: datasource=github-releases depName=mvdan/sh
  SHFMT_VERSION: v3.14.0

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      # shellcheck reads .shellcheckrc (external-sources + repo-specific disables).
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck -x \
            setup \
            install \
            tests/run \
            scripts/setup-arch.sh \
            scripts/setup-debian.sh \
            scripts/setup-fedora.sh \
            scripts/install-arch.sh \
            scripts/install-arch-backup.sh \
            scripts/install-arch-reinstall.sh \
            scripts/lib/common.sh \
            scripts/lib/install.sh \
            tests/container/run-host.sh \
            tests/container/smoke.sh \
            tests/container/stub.sh \
            tests/install/loopback-smoke.sh \
            tests/install/arch-vm.sh \
            tests/vm/run.sh \
            tests/vm/provision.sh \
            tests/vm/assert.sh \
            tests/manual/lib/common.sh \
            tests/manual/arch-install-vm-create.sh \
            tests/manual/arch-install-vm-run.sh \
            tests/manual/setup-vm-create.sh \
            tests/manual/setup-vm-run.sh \
            tests/manual/preflight.sh \
            config/fedora/snapper/*.sh \
            config/fedora/grub-cryptomount/99_cryptomount_check \
            vars/arch-vars \
            vars/debian-vars \
            vars/fedora-vars

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shfmt
        run: |
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt

      - name: Check formatting (-i 4 -ci)
        run: |
          /tmp/shfmt --version
          /tmp/shfmt -d -i 4 -ci \
            setup \
            install \
            tests/run \
            scripts/lib/common.sh \
            scripts/lib/install.sh \
            scripts/install-arch.sh \
            scripts/install-arch-backup.sh \
            scripts/install-arch-reinstall.sh \
            scripts/setup-arch.sh \
            scripts/setup-debian.sh \
            scripts/setup-fedora.sh \
            tests/container/run-host.sh \
            tests/container/smoke.sh \
            tests/container/stub.sh \
            tests/install/loopback-smoke.sh \
            tests/install/arch-vm.sh \
            tests/vm/run.sh \
            tests/vm/provision.sh \
            tests/vm/assert.sh \
            tests/manual/lib/common.sh \
            tests/manual/arch-install-vm-create.sh \
            tests/manual/arch-install-vm-run.sh \
            tests/manual/setup-vm-create.sh \
            tests/manual/setup-vm-run.sh \
            tests/manual/preflight.sh \
            config/fedora/snapper/*.sh \
            config/fedora/grub-cryptomount/99_cryptomount_check \
            vars/arch-vars \
            vars/debian-vars \
            vars/fedora-vars
